[workspace]
authors = ["Kago <kmotlhabane769@gmail.com>"]
channels = ["https://prefix.dev/conda-forge"]
name = "COS700"
version = "0.1.0"
platforms = [
    { platform = "win-64", cuda = "13.1" },
    { platform = "linux-64", cuda = "12.0", glibc = "2.17" },
]

[tasks]
tests = "python -m src.src_tests --num1=1 --num2=2 --num3=5"
cls_imb_s = "python -m src.class_imbalance_ratios.run_with_cfg"
batch_experim = "python -m src.class_imbalance_ratios.batch_run_pbs"
post_proc = "python -m src.class_imbalance_ratios.analysis.post_proc_conversions"

cls_imb_datamodule = "python -m src.class_imbalance_ratios.datamodule.cls_imb_datamodule"
test_dir_path = "python -m src.class_imbalance_ratios.tests"

[dependencies]
setuptools = "<81"
pytorch-gpu = "*"
lightning = "*"
hydra-zen = ">=0.16.0,<0.17"
torchvision = "*"
transformers = "<5.19.0"
lightning-bolts = "*"
beartype = ">=0.22.9,<0.23"
numpy = "*"
tensorboard = "*"
matplotlib = "*"
scikit-learn = "*"
gdown = ">=6.1.0,<7"
pysocks = ">=1.7.1,<2"
scikit-image = "*"
pillow = "10.4.0.*"
pandas = "*"
imbalanced-learn = ">=0.14.2,<0.15"
tqdm = ">=4.70.1,<5"
pydantic = ">=2.13.5,<3"
jupyterlab = ">=4.6.3,<5"
ipykernel = ">=7.3.0,<8"
pip = ">=26.2.1,<27"
ipywidgets = ">=8.1.9,<9"
notebook = ">=7.6.2,<8"
nbconvert = ">=7.17.1,<8"
scienceplots = "*"
torchmetrics = "<=1.3.2"
pyarrow = ">=19.0.1,<26"
ipympl = ">=0.10.0,<0.11"

[target.win-64.pypi-dependencies]
triton-windows = ">=3.8.0.post28, <4"

[target.linux-64.pypi-dependencies]
setuptools = "<81"

[pypi-dependencies]
muon-optimizer = { git = "https://github.com/KellerJordan/Muon" }
jupyter-contrib-nbextensions = ">=0.7.0, <0.8"
